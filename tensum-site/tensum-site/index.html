<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TenSum - Number Puzzle</title>
<meta name="description" content="TenSum is a fast-paced number puzzle game. Tap numbers that add up to the target!">
<style>
  :root{--bg:#04060f;--card:#0b1226;--yellow:#ffd600;--blue:#2f74ff;}
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(circle at 30% 20%,#0e1730 0%,#080f22 55%,#04060f 100%);
    color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .card{max-width:480px;width:100%;text-align:center;}
  .icon{width:120px;height:120px;border-radius:28px;margin-bottom:24px;box-shadow:0 0 60px rgba(47,116,255,.35);}
  h1{font-size:32px;margin:0 0 8px;font-weight:800;}
  h1 span{color:var(--blue);}
  p.tag{color:#9fb2d6;font-size:17px;margin:0 0 28px;line-height:1.5;}
  .btn{
    display:inline-block;background:var(--yellow);color:#04060f;font-weight:700;
    padding:14px 32px;border-radius:14px;text-decoration:none;font-size:16px;
    box-shadow:0 6px 24px rgba(255,214,0,.25);
  }
  .btn:hover{opacity:.9;}
  footer{margin-top:48px;color:#5c6a8a;font-size:13px;}
  footer a{color:#8fa0c5;}
</style>
</head>
<body>
  <div class="card">
    <img class="icon" src="icon.png" alt="TenSum icon" onerror="this.style.display='none'">
    <h1>Ten<span>Sum</span></h1>
    <p class="tag">A fast-paced number puzzle.<br>Tap numbers that add up to the target!</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.tensum.app" target="_blank" rel="noopener">
      Get it on Google Play
    </a>
    <footer>
      Beneviat Games &middot; <a href="mailto:beneviatgames@gmail.com">beneviatgames@gmail.com</a><br>
      <a href="https://telegra.ph/Privacy-Policy-for-TenSum-06-20" target="_blank" rel="noopener">Privacy Policy</a>
    </footer>
  </div>
</body>
</html>
